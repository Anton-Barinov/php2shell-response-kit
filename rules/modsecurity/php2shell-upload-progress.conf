# =============================================================================
#  ORBITRON php2shell (CVE-2026-109618 / CVE-2026-109619) - ModSecurity rules   v1.0.0 (2026-10-21)
#
#  Hunting rule for the PHP "session upload progress" mechanism that GMO Flatt Security links to
#  php2shell. The mechanism is triggered by a multipart/form-data request that contains a form field
#  named like session.upload_progress.name (default PHP_SESSION_UPLOAD_PROGRESS).
#
#  IMPORTANT
#   - Flatt Security updated its analysis on 2026-10-21: disabling session.upload_progress is only a
#     partial mitigation and the attack is expected to be possible without it. These rules therefore
#     cover ONE suspected vector. They are a hunting/visibility control, NOT a fix. Patch PHP.
#   - Requires request body inspection (SecRequestBodyAccess On). Requests larger than
#     SecRequestBodyLimit / with multipart parsing errors are not inspected - see rule 9109621.
#   - If you changed session.upload_progress.name, edit the field name below.
#   - Rule IDs 9109618-9109621: change them if they collide with your local ranges.
#   - Tested on ModSecurity 2.9 / Apache 2.4 (Ubuntu 24.04) in a lab; test on your stack before use.
#
#  Install (Apache/ModSecurity v2):  Include this file after your CRS/ModSecurity config.
#  ModSecurity v3 (nginx connector): same syntax, include from modsecurity.conf/main.conf.
# =============================================================================

# 9109618 - LOG ONLY: upload-progress field present in a multipart request.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" \
    "id:9109618,phase:2,pass,log,auditlog,t:none,\
    msg:'php2shell hunting: PHP session upload-progress field in multipart request',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'php2shell',tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'attack-rce',\
    severity:'WARNING',chain"
    SecRule ARGS_POST_NAMES "@rx ^PHP_SESSION_UPLOAD_PROGRESS$" \
        "t:none,setvar:'tx.php2shell_upload_progress=1'"

# 9109619 - LOG ONLY: same field with an unusually long value (prefix + value becomes a session key).
SecRule ARGS_POST:PHP_SESSION_UPLOAD_PROGRESS "@gt 64" \
    "id:9109619,phase:2,pass,log,auditlog,t:length,\
    msg:'php2shell hunting: oversized PHP session upload-progress value',\
    tag:'php2shell',tag:'CVE-2026-109618',tag:'CVE-2026-109619',severity:'ERROR'"

# 9109620 - BLOCKING VARIANT (disabled). Enable ONLY for applications that do not use PHP upload
# progress bars (very few do). Blocking this field does not stop other possible vectors.
# SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" \
#     "id:9109620,phase:2,deny,status:403,log,auditlog,t:none,\
#     msg:'php2shell: blocked PHP session upload-progress field',\
#     tag:'php2shell',tag:'CVE-2026-109618',tag:'CVE-2026-109619',severity:'CRITICAL',chain"
#     SecRule ARGS_POST_NAMES "@rx ^PHP_SESSION_UPLOAD_PROGRESS$" "t:none"

# 9109621 - LOG ONLY: multipart body that ModSecurity could not parse strictly (uninspected body).
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:9109621,phase:2,pass,log,auditlog,t:none,\
    msg:'php2shell hunting: multipart request failed strict parsing (body not fully inspected)',\
    logdata:'%{MULTIPART_STRICT_ERROR}',\
    tag:'php2shell',severity:'WARNING'"
